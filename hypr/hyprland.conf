# ── Monitors ────────────────────────────────────────────────────
monitor = HDMI-A-3, preferred, 0x0, 1
monitor = eDP-1,    disable

# ── Programs ────────────────────────────────────────────────────
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun

# ── Autostart ───────────────────────────────────────────────────
exec-once = hyprctl setcursor Moga-Candy-Magenta 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Classic"
exec-once = awww-daemon
exec-once = awww img /home/udon/Dotfiles/hypr/walls/wall2.jpg
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = mako

# ── Environment ─────────────────────────────────────────────────
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Moga-Candy-Magenta
env = HYPRCURSOR_SIZE,64

# ── Input ───────────────────────────────────────────────────────
input {
    kb_layout    = gb
    follow_mouse = 1
    sensitivity  = -0.45

    touchpad {
        natural_scroll = false
    }
}

# ── General ─────────────────────────────────────────────────────
general {
    gaps_in  = 3
    gaps_out = 7

    border_size         = 2
    col.active_border   = rgb(bf6c40) rgb(bf6c40) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    layout           = dwindle
    allow_tearing    = false
}

# ── Decoration ──────────────────────────────────────────────────
decoration {
    rounding = 0

    blur {
        enabled = true
        size    = 3
        passes  = 3
    }

    shadow {
        enabled      = false
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }
}

# ── Animations ──────────────────────────────────────────────────
animations {
    enabled = true

    bezier = defaultBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,     1, 7, defaultBezier
    animation = windowsOut,  1, 7, default, popin 80%
    animation = border,      1, 10, default
    animation = borderangle, 1, 8,  default
    animation = fade,        1, 7,  default
    animation = workspaces,  1, 6,  defaultBezier
}

# ── Layouts ─────────────────────────────────────────────────────
dwindle {
    pseudotile     = true
    preserve_split = false
}

master {
    mfact = 0.5
}

# ── Misc ────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
    focus_on_activate       = false
}

# ── Window rules ────────────────────────────────────────────────

# File dialogs
windowrule = float on,     match:class xdg-desktop-portal-gtk
windowrule = float on,     match:title Open File
windowrule = float on,     match:title Save File
windowrule = float on,     match:title Save As
windowrule = center on,    match:title Open File
windowrule = center on,    match:title Save File
windowrule = center on,    match:title Save As
windowrule = size 900 600, match:title Open File
windowrule = size 900 600, match:title Save File
windowrule = size 900 600, match:title Save As

# Thunar — float detached dialogs (not the main window)
windowrule = float on,  match:class thunar, match:initial_title ^(?!.*Thunar)
windowrule = center on, match:class thunar, match:initial_title ^(?!.*Thunar)

# Wofi launcher
windowrule = float on,        match:class wofi
windowrule = no_anim on,      match:class wofi
windowrule = stay_focused on, match:class wofi
windowrule = border_size 0,   match:class wofi

# Picture-in-picture
windowrule = float on,    match:title Picture-in-Picture
windowrule = pin on,      match:title Picture-in-Picture
windowrule = move 73% 7%, match:title Picture-in-Picture

# Idle inhibit while Firefox is fullscreen
windowrule = idle_inhibit fullscreen, match:class firefox

# ── Workspace → Monitor assignments ─────────────────────────────
workspace = 1,  monitor:HDMI-A-3
workspace = 2,  monitor:DP-1
workspace = 3,  monitor:DP-1
workspace = 4,  monitor:DP-1
workspace = 5,  monitor:DP-1
workspace = 6,  monitor:DP-1
workspace = 7,  monitor:DP-1
workspace = 8,  monitor:DP-1
workspace = 9,  monitor:DP-1
workspace = 10, monitor:DP-1

# ── Keybinds ────────────────────────────────────────────────────
$mainMod = SUPER

# Apps
bind = $mainMod,       T, exec,          $terminal
bind = $mainMod,       Q, killactive,
bind = $mainMod,       M, exit,
bind = $mainMod,       E, exec,          $fileManager
bind = $mainMod,       W, togglefloating,
bind = $mainMod,       A, exec,          $menu
bind = $mainMod,       P, pseudo,
bind = $mainMod,       B, exec,          firefox
bind = $mainMod,  period, exec,          wofi-emoji
bind =         ,      F9, fullscreen,
bind = $mainMod, backslash,       exec,  $HOME/.config/hypr/scripts/layout.sh
bind = $mainMod SHIFT, backslash, exec,  $HOME/.config/hypr/scripts/layout2.sh

# Screenshots
bind = $mainMod,       S, exec, grim -o DP-1 $HOME/Pictures/screenshots/screenshot-$(date +%F-%T).png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" $HOME/Pictures/screenshots/screenshot-$(date +%F-%T).png

# Focus — arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Focus — hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Lock
bind = $mainMod, L, exec, hyprlock

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
