# ── Font ────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0

# ── Cursor ──────────────────────────────────────────────────────
cursor                #F2CDCD
cursor_text_color     #161320
cursor_shape          block
cursor_blink_interval 0

# ── Selection ───────────────────────────────────────────────────
selection_foreground #161320
selection_background #C9CBFF

# ── Window ──────────────────────────────────────────────────────
window_padding_width 12
hide_window_decorations yes

# ── Colors ──────────────────────────────────────────────────────
background #161320
foreground #D9E0EE

# black
color0  #302D41
color8  #6E6C7E

# red
color1  #F28FAD
color9  #F28FAD

# green
color2  #ABE9B3
color10 #ABE9B3

# yellow (peach)
color3  #F8BD96
color11 #F8BD96

# blue
color4  #96CDFB
color12 #96CDFB

# magenta (pink)
color5  #F5C2E7
color13 #F5C2E7

# cyan (sky)
color6  #89DCEB
color14 #89DCEB

# white
color7  #D9E0EE
color15 #D9E0EE

# ── Tab bar ─────────────────────────────────────────────────────
tab_bar_style                 powerline
tab_powerline_style           slanted
tab_bar_background            #161320
tab_title_template            {title}
active_tab_foreground         #161320
active_tab_background         #C9CBFF
active_tab_font_style         bold
inactive_tab_foreground       #6E6C7E
inactive_tab_background       #1E1E2E
inactive_tab_font_style       normal

# ── Misc ────────────────────────────────────────────────────────
enable_audio_bell no
