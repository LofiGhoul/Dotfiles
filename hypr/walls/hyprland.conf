source = ~/.config/hypr/monitors.conf

# ── Programs ────────────────────────────────────────────────────
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun

# ── Autostart ───────────────────────────────────────────────────
exec-once = hyprctl setcursor Moga-Candy-Magenta 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Classic"
exec-once = hyprpaper
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent

# ── Environment ─────────────────────────────────────────────────
env = QT_QPA_PLATFORMTHEME,qt6ct
env = WLR_DRM_NO_ATOMIC,1
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,"Bibata-Modern-Classic"
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Moga-Candy-Magenta
env = HYPRCURSOR_SIZE,64

# ── Input ───────────────────────────────────────────────────────
input {
    kb_layout  = gb
    follow_mouse = 1
    sensitivity  = -0.45

    touchpad {
        natural_scroll = no
    }
}

# ── General ─────────────────────────────────────────────────────
general {
    gaps_in  = 3
    gaps_out = 7

    border_size         = 2
    col.active_border   = rgb(4a7fa5) rgb(e8c97a) 45deg
    col.inactive_border = rgba(2a4a3066)

    layout        = dwindle
    allow_tearing = false
}

# ── Decoration ──────────────────────────────────────────────────
decoration {
    rounding = 0

    blur {
        enabled = true
        size    = 3
        passes  = 3
    }
}

# ── Animations ──────────────────────────────────────────────────
animations {
    enabled = yes

    bezier = defaultBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,    1, 7, defaultBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border,     1, 10, default
    animation = borderangle,1, 8,  default
    animation = fade,       1, 7,  default
    animation = workspaces, 1, 6,  defaultBezier
}

# ── Layouts ─────────────────────────────────────────────────────
dwindle {
    pseudotile     = yes
    preserve_split = no
}

master {
    mfact = 0.5
}

# ── Misc ────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = -1
}

# ── Workspace → Monitor assignments ─────────────────────────────
workspace = 1,  monitor:HDMI-A-1
workspace = 2,  monitor:DP-1
workspace = 3,  monitor:DP-1
workspace = 4,  monitor:DP-1
workspace = 5,  monitor:DP-1
workspace = 6,  monitor:DP-1
workspace = 7,  monitor:DP-1
workspace = 8,  monitor:DP-1
workspace = 9,  monitor:DP-1
workspace = 10, monitor:DP-1

# ── Keybinds ────────────────────────────────────────────────────
$mainMod = SUPER

# Apps
bind = $mainMod,       T, exec,          $terminal
bind = $mainMod,       Q, killactive,
bind = $mainMod,       M, exit,
bind = $mainMod,       E, exec,          $fileManager
bind = $mainMod,       W, togglefloating,
bind = $mainMod,       A, exec,          $menu
bind = $mainMod,       P, pseudo,
bind = $mainMod,       B, exec,          firefox
bind = $mainMod,  period, exec,          wofi-emoji
bind =         ,      F9, fullscreen,
bind = $mainMod, backslash,       exec,  "${HOME}/.config/hypr/scripts/layout.sh"
bind = $mainMod SHIFT, backslash, exec,  "${HOME}/.config/hypr/scripts/layout2.sh"

# Screenshots
bind = $mainMod,       S, exec, grim -o DP-1 "${HOME}/Pictures/screenshots/screenshot-$(date +%F-%T).png"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" "${HOME}/Pictures/screenshots/screenshot-$(date +%F-%T).png"

# Focus — arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Focus — hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
